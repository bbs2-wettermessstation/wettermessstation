services:
  db:
    image: mariadb:11
    container_name: wetter-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Europe/Berlin
    volumes:
      - db-daten:/var/lib/mysql
      - ./init_database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:3306:3306"

  web:
    build: ./docker
    container_name: wetter-web
    restart: unless-stopped
    depends_on:
      - db
    environment:
      TZ: Europe/Berlin
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD}
    volumes:
      - ./www:/var/www/html:ro
    ports:
      - "80:80"

volumes:
  db-daten:
